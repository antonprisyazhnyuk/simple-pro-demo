body { margin: 0; background: var(--grey-10); color: var(--grey-70); font-family: "Geologica", sans-serif; }
.demo-spacer { height: 40vh; display: grid; place-items: center; background: var(--grey-0);
  font-size: .875rem; color: var(--text-secondary); }

.sh-scene { position: relative; height: 1100vh; }
.sh-sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; background: var(--grey-10); }
.sh-stage { position: absolute; left: 50%; top: 50%; width: 120rem; height: 60rem; transform-origin: 0 0; }

.sh-logo { position: absolute; max-width: none; }
.sh-img { position: absolute; left: 0; top: 0; width: 240rem; height: 240rem; max-width: none; transform-origin: 0 0;
  will-change: transform; user-select: none; pointer-events: none; }
.sh-layer { position: absolute; inset: 0; pointer-events: none; }

/* точки общего вида — белые, в покое */
.sh-pt { position: absolute; width: 2rem; height: 2rem; margin: -1rem 0 0 -1rem; border-radius: 50%;
  border: 1px solid var(--grey-0); transition: opacity .3s; }
.sh-pt::after { content: ""; position: absolute; left: 50%; top: 50%; width: .75rem; height: .75rem; margin: -.375rem 0 0 -.375rem;
  border-radius: 50%; background: var(--grey-0); }
.sh-pt { padding: 0; background: none; cursor: pointer; transition: opacity .3s, transform .2s ease-out; }
.sh-pt::after { transition: background-color .2s; }
.sh-pt::before { content: ""; position: absolute; inset: -1.5rem; border-radius: 50%; }   /* зона клика больше видимой точки */
.sh-pt:hover, .sh-pt:focus-visible { transform: scale(1.15); outline: none; }
.sh-pt:hover::after, .sh-pt:focus-visible::after { background: var(--red-brand); }
.sh-pts { opacity: 0; transition: opacity .35s; }
.sh-pts.is-on { opacity: 1; }
.sh-pts.is-on .sh-pt { pointer-events: auto; }   /* кликабельны только на общем виде */

/* активная точка шага: белое кольцо 108 + красная точка 16 */
.sh-hot { position: absolute; width: 6.75rem; height: 6.75rem; margin: -3.375rem 0 0 -3.375rem; border-radius: 50%;
  border: 1px solid var(--grey-0); opacity: 0; transform: scale(.5); transition: opacity .3s, transform .4s cubic-bezier(.2,.8,.2,1); }
.sh-hot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 1rem; height: 1rem; margin: -.5rem 0 0 -.5rem;
  border-radius: 50%; background: var(--red-brand); }

/* линия точками: штрих ~0 + круглые концы, как в макете (2.5 · шаг 6) */
.sh-line { position: absolute; left: 0; top: 0; overflow: visible; }
.sh-line line { stroke: var(--red-brand); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: .01 6; }
.sh-line { opacity: 0; transition: opacity .25s; }
.sh-wipe { transition: clip-path .4s ease-out; }

/* плашка */
.sh-plate { position: absolute; bottom: 3.375rem; box-sizing: border-box; padding: 2rem; border-radius: var(--r-8); background: var(--grey-0);
  display: flex; flex-direction: column; gap: 1.5rem; opacity: 0; transform: translateY(1rem);
  transition: opacity .3s .05s, transform .35s .05s; }
.sh-title { font-family: "Simplepro Display", sans-serif; font-weight: 700; font-size: 3rem; line-height: 3.25rem; color: var(--grey-70); }
.sh-cap { font-size: 1.125rem; line-height: 1.5rem; font-weight: 400; color: var(--grey-50); white-space: pre-wrap;   /* текст один в один с макетом, включая двойной пробел источника */ }

.is-on .sh-hot { opacity: 1; transform: none; }
.is-on .sh-line { opacity: 1; }
.is-on .sh-plate { opacity: 1; transform: none; }
/* ---------- 1440 / 1280 / телефон — числа рядов Figma «shkaf / 1440», «/ 1280», «/ 360» ---------- */

// какой набор на какой ширине: середины между брейкпоинтами гига 1920 · 1440 · 1280 · 360 (моб — порог главной, 45rem)
const pick = () => innerWidth <= 720 ? 'mob' : innerWidth < 1360 ? 'w1280' : innerWidth < 1680 ? 'w1440' : 'desk';
const N = 8, LEAD = 0.6, TAIL = 0.6, MOVE = 0.62, DIP = 0.35;
const SHOW = 0.85, KEEP = 0.12;   // выноска выходит на подлёте (85% наезда) и держится, пока камера не отъедет на 12% следующего
const LAG = 0.14;   // инерция, с: движение догоняет скролл, а не прыгает за каждым щелчком колеса
const $ = (id) => document.getElementById(id);
const scene = $('shScene'), stage = $('shStage'), img = $('shImg');
const rem = (px) => px / 16 + 'rem';

let V, L, K, PTS, ptEls = [], DY = 0;                        // V — текущий набор, L — его имя; DY — сдвиг под реальную высоту экрана
function useLayout() {
  L = pick(); V = DATA[L]; K = V.K; scene.dataset.l = L;
  const P0 = K[0];
  PTS = V.points.map(([x, y]) => [(x - P0.ox) / P0.s, (y - P0.oy) / P0.s]);   // точки — в координатах картинки, едут со шкафом
  $('shPts').innerHTML = PTS.map((_, k) => `<button type="button" class="sh-pt" aria-label="${K[k + 1].cap.replace(/\s+/g, ' ')}"></button>`).join('');
  ptEls = [...$('shPts').children];
  bindPoints();
  const [lx, ly, lw, lh] = V.logo;
  Object.assign($('shLogo').style, { left: rem(lx), top: rem(ly), width: rem(lw), height: rem(lh) });
  $('shSvg').setAttribute('viewBox', `0 0 ${V.W} ${V.H}`);
  active = null;
  fit();
}

function fit() {
  // холст — по ширине окна; если окно ниже холста — по высоте (по бокам фон). Высота холста тянется под экран, сцена по центру (DY)
  let k = innerWidth / V.W;
  if (innerHeight / k < V.H) k = innerHeight / V.H;
  const h = innerHeight / k;
  DY = (h - V.H) / 2;
  Object.assign(stage.style, { width: rem(V.W), height: rem(h), transform: `scale(${k}) translate(-50%, -50%)` });
  $('shSvg').setAttribute('viewBox', `0 0 ${V.W} ${h}`);
  Object.assign($('shSvg').style, { width: rem(V.W), height: rem(h) });
  $('shLogo').style.top = rem(V.logo[1] + DY);
}
const ease = (t) => t * t * t * (t * (t * 6 - 15) + 10);   // smootherstep: мягкий разгон и торможение, без рывка на стыке
const lerp = (a, b, t) => a + (b - a) * t;

let active = null;
function setState(step, overview) {   // step 1…8 — шаг; overview — общий вид
  $('shPts').classList.toggle('is-on', overview);
  const key = step || 0;
  if (key === active) return; active = key;
  $('shStep').classList.remove('is-on');
  if (!step) return;
  const k = K[step], [px, , pw] = k.plate, rx = k.ring[0], ry = k.ring[1] + DY;
  const plate = $('shPlate'), mob = L === 'mob';
  Object.assign(plate.style, { left: rem(px), width: rem(pw) });   // по вертикали плашка прижата к низу экрана (bottom в CSS)
  $('shTitle').textContent = k.title; $('shCap').textContent = k.cap;
  $('shHot').style.left = rem(rx); $('shHot').style.top = rem(ry);
  const Ln = $('shLine'), top = plate.offsetTop, mid = top + plate.offsetHeight / 2;
  Ln.setAttribute('x1', rx); Ln.setAttribute('y1', ry);
  if (mob) { Ln.setAttribute('x2', rx); Ln.setAttribute('y2', top); }       // телефон: вниз к верху плашки

    g.style.transition = ''; g.style.clipPath = 'inset(0 0 0 0)'; $('shStep').classList.add('is-on');
  }));
}

const TOTAL = LEAD + (N + 1) + TAIL;                        // держим вход · 9 переходов (8 шагов + финал) · держим финал
function target() {

  const goal = target();
  if (cur === null) cur = goal;
  const dt = last ? Math.min((now - last) / 1000, .05) : .016; last = now;
  cur += (goal - cur) * (1 - Math.exp(-dt / LAG));
  if (Math.abs(goal - cur) < 1e-4) cur = goal;
  render(cur);
  if (cur !== goal) requestAnimationFrame(tick); else { running = false; last = 0; }
}
function kick() { if (!running) { running = true; requestAnimationFrame(tick); } }

function camera(a, b, t, far) {
  // центр взгляда — по прямой, масштаб — по логарифму с провалом посередине (отъезд между деталями)
  const W2 = V.W / 2, H2 = V.H / 2;
  const cx = (k) => (W2 - k.ox) / k.s, cy = (k) => (H2 - k.oy) / k.s;
  const s = Math.exp(lerp(Math.log(a.s), Math.log(b.s), t)) * (1 - far * Math.sin(Math.PI * t));
  const fx = lerp(cx(a), cx(b), t), fy = lerp(cy(a), cy(b), t);
  const ox = W2 - fx * s, oy = H2 - fy * s + DY;
  img.style.transform = `translate3d(${rem(ox)}, ${rem(oy)}, 0) scale(${s})`;
  ptEls.forEach((el, k) => { el.style.left = rem(ox + PTS[k][0] * s); el.style.top = rem(oy + PTS[k][1] * s); });
}

function render(p) {
  if (jump) return;
  let a = K[0], b = K[0], t = 0, step = 0, overview = true;
  if (p >= N + 1) { a = b = K[N + 1]; }                       // финал
  else if (p > 0) {
    const i = Math.floor(p), f = p - i;
    a = K[i]; b = K[i + 1];
    const m = f < MOVE ? f / MOVE : 1;
    t = ease(m);
    overview = i + 1 > N && m >= SHOW;
    if (m >= SHOW && i + 1 <= N) step = i + 1;              // подлёт и остановка — выноска своей детали
    else if (m < KEEP && i >= 1) step = i;                  // камера только тронулась — прежняя ещё держится
  }
  camera(a, b, t, (a === K[0] || b === K[N + 1] || a === b) ? 0 : DIP);
  setState(step, overview);
}

/* Клик по точке на общем виде: камера летит ПРЯМО к детали (без пролёта через соседние шаги),
   а скролл тихо переставляется на остановку этого шага — дальше листается как обычно. */
let jump = null;
const JUMP = 1100;   // мс
function fly(now) {
  const m = Math.min((now - jump.t0) / JUMP, 1);
  camera(jump.a, K[jump.k], ease(m), 0);
  setState(m >= SHOW ? jump.k : 0, false);
  if (m < 1) requestAnimationFrame(fly);
  else { jump = null; cur = target(); render(cur); }
}
function bindPoints() {
  // фокус кнопки в закреплённом слое заставляет браузер прокрутить страницу к её «настоящему» месту — и мышь
  // отпускается уже мимо точки, клика нет. Фокус от мыши не нужен: глушим его на mousedown.
  ptEls.forEach((el) => el.addEventListener('mousedown', (e) => e.preventDefault()));
  ptEls.forEach((el, i) => el.addEventListener('click', () => {
    const k = i + 1, travel = scene.offsetHeight - innerHeight;
    const p = (k - 1) + MOVE + (1 - MOVE) / 2;               // середина остановки шага k
    jump = { a: K[0], k, t0: performance.now() };
    scrollTo({ top: scene.offsetTop + travel * (p + LEAD) / TOTAL, behavior: 'instant' });
    requestAnimationFrame(fly);
  }));
}
addEventListener('resize', () => { if (pick() !== L) useLayout(); else fit(); active = null; render(cur ?? target()); kick(); });
addEventListener('scroll', kick, { passive: true });
useLayout(); render(target()); kick();   // первый кадр — сразу, не дожидаясь анимационного цикла (он спит во скрытой вкладке)
</script>
</body>
</html>
