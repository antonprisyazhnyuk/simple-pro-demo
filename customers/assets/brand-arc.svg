<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <!-- Фирменная графика Simplepro — дуга хаба «Покупателю».
       Рецепт брендбука стр. 28: контур постоянной толщины с линейным градиентом,
       непрозрачность 100 % на положении 40 % → 0 % на положении 80 %.

       ГЕОМЕТРИЯ ПЕРЕСЧИТАНА, а не взята из research/brand-graphics/index.html.
       Тамошний «длинный» вариант (r 460, толщина 110 в поле 700) физически не влезает
       в собственный viewBox: круг диаметром 920 обрезается его границами, и вместо
       дуги рисуются три угловатых обрубка (поймано кадром 04.08). Лид этот вариант и
       доделывает. Здесь взято поле целиком: r = (700 − 110) / 2 = 295, с запасом 290,
       центр 350 350 — дуга не касается границ ни в одной точке.
       Раскрытие 270° с проёмом внизу слева — «C» центральной полосы брендбука
       и форма, нарисованная Антоном в макете 2261:16668.

       Градиент направлен из нижнего правого угла (плотно) в верхний левый (нисходит
       в ноль) — так же читается заглушка Антона: правая нижняя часть кольца плотная,
       верхний хвост растворяется.

       ⚠ Серый вместо белого — отступление от буквы брендбука, принято осознанно.
       Брендбук держит дугу белой и только на светло-сером #D1D6D9; поле хаба белое,
       и белая дуга на нём невидима. Инверсию принял сам Антон в макете (дуга
       нарисована светло-серым по белому), мы её и воспроизводим. Обратно в белое —
       только вместе с решением «поле хаба серое». Серый = примитив дома
       grey-20 (#E6E9EB); grey-30-brand (#D2D7DA) пробовали кадром —
       на белом он спорит с карточками контента, а брендбучный контраст дуги низкий
       по построению (белое на светло-сером): в ассете hex допустим, в CSS — нет.

       ⛔ ДВОЙНОГО ДЕФИСА В КОММЕНТАРИИ БЫТЬ НЕ ДОЛЖНО. Он ломает XML, и SVG перестаёт
       парситься целиком: браузер отдаёт naturalWidth 0 и рисует битую картинку,
       не сказав об этом ни слова в консоль. Поймано боем 04.08 на первой версии файла,
       где токены дома были названы через двойной дефис. -->
  <defs>
    <linearGradient id="spArcHub" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0.40" stop-color="#E6E9EB" stop-opacity="1"/>
      <stop offset="0.80" stop-color="#E6E9EB" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M 350 60 A 290 290 0 1 1 60 350"
        fill="none" stroke="url(#spArcHub)" stroke-width="110" stroke-linecap="butt"/>
</svg>
