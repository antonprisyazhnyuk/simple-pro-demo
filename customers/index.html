<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ⛔ NOINDEX — не опция, а требование паспорта гига. Это демо-копия страниц живого
       simple-pro.com; попав в индекс, она станет ДУБЛЕМ сайта клиента, чьё SEO ведёт
       его собственный подрядчик. Мета стоит на КАЖДОЙ странице сборки и работает
       независимо от того, куда её положили. Второй контур — code/robots.txt, но он
       читается только из КОРНЯ домена: ляжет сборка в подкаталог проекта Pages —
       робот его не увидит вовсе, и эта строка останется единственной защитой.
       Снимать только вместе с решением «сайт уезжает клиенту как боевой». -->
  <meta name="robots" content="noindex, nofollow">
  <title>Покупателю — Simple PRO</title>

  <!-- ═══ ЗАГЛУШКА-ПЕРЕХОД НА ПЕРВЫЙ РАЗДЕЛ ХАБА ═══
       Зачем вообще файл. На живом simple-pro.com /customers/ — настоящая страница
       («Информация для покупателей», 200). В нашей сборке её не было, и адрес отдавал
       404: существующий URL клиента умирать не должен даже в демо.
       Решение Антона 04.08 19:35 — /customers/ уводит на первый раздел, prices/.
       Его логика: хаб это ОДНА страница с девятью состояниями, поэтому «Покупателю»
       естественно открывается своим первым состоянием, а отдельная вводная не нужна.

       ⚠ ПОЧЕМУ ЗАГЛУШКА, А НЕ РЕДИРЕКТ. На GitHub Pages серверных правил нет — ни
       .htaccess, ни конфига nginx, ни 301. Единственный доступный способ увести
       посетителя — средства самой страницы. Здесь их три, и это не перестраховка:
         1. meta refresh — работает даже при выключенном JS;
         2. location.replace — уводит быстрее и НЕ оставляет запись в истории, иначе
            кнопка «назад» возвращала бы сюда и снова выкидывала вперёд (петля);
         3. видимая ссылка текстом — запасной путь, если оба способа заблокированы
            расширением или политикой браузера. Человек не должен упереться в пустой
            белый экран, что бы ни отключили.

       ⛔ В ПАКЕТ ДЛЯ ПОДРЯДЧИКА ОТДЕЛЬНОЙ СТРОКОЙ: при переносе в Bitrix эту заглушку
       заменить настоящим 301 на /customers/prices/. meta refresh поисковики трактуют
       как редирект лишь приблизительно, и на боевом сайте клиента, чьё SEO ведёт его
       подрядчик, оставлять её вместо серверного правила нельзя. -->
  <meta http-equiv="refresh" content="0; url=prices/">
  <link rel="canonical" href="https://simple-pro.com/customers/prices/">
  <link rel="icon" href="../assets/figma/s-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../product-card/css/tokens.css">
  <style>
    /* Страница живёт доли секунды — свой файл стилей ей заводить не за чем.
       Всё, что нужно, приезжает из токен-слоя дома (шрифты, цвета, кегли). */
    .redirect-note {
      display: grid; place-content: center; gap: var(--sp-16);
      min-height: 100dvh; padding: var(--sp-24);
      text-align: center;
    }
    .redirect-note a { color: var(--text-link); text-decoration: underline; }
  </style>
</head>
<body>
  <main class="redirect-note">
    <h1>Покупателю</h1>
    <p>Открываем раздел «Цены».</p>
    <p><a href="prices/">Перейти вручную, если переход не сработал</a></p>
  </main>
  <script>
    /* replace, а не href: запись в истории не остаётся, и «назад» не швыряет
       посетителя обратно на эту же страницу с повторным переходом вперёд. */
    location.replace("prices/");
  </script>
</body>
</html>
